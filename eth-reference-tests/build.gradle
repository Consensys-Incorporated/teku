jar { enabled = false }

configurations {
	// Local configuration for generateReferenceTestClasses — avoids cross-project lock issues in Gradle 9
	refTestGenerator
}

dependencies {
	refTestGenerator project(':eth-tests')

	referenceTestImplementation project(':beacon:validator')
	referenceTestImplementation project(':ethereum:networks')
	referenceTestImplementation project(':ethereum:spec')
	referenceTestImplementation testFixtures(project(':ethereum:spec'))
	referenceTestImplementation testFixtures(project(':ethereum:statetransition'))
	referenceTestImplementation project(':ethereum:statetransition')
	referenceTestImplementation project(':networking:eth2')
	referenceTestImplementation project(':eth-tests')
	referenceTestImplementation project(':infrastructure:bls')
	referenceTestImplementation project(':infrastructure:serviceutils')
	referenceTestImplementation project(':infrastructure:ssz')
	referenceTestImplementation testFixtures(project(':infrastructure:ssz'))
	referenceTestImplementation project(':storage')
	referenceTestImplementation testFixtures(project(':storage'))
	referenceTestImplementation project(':infrastructure:async')
	referenceTestImplementation project(':infrastructure:io')
	referenceTestImplementation testFixtures(project(':infrastructure:async'))
	referenceTestImplementation testFixtures(project(':infrastructure:kzg'))
	referenceTestImplementation testFixtures(project(':infrastructure:metrics'))
	referenceTestImplementation project(':infrastructure:time')
	referenceTestImplementation testFixtures(project(':infrastructure:time'))
	referenceTestImplementation project(':data:dataexchange')

	referenceTestImplementation 'org.hyperledger.besu:besu-plugin-api'
	referenceTestImplementation 'com.fasterxml.jackson.core:jackson-databind'
	referenceTestImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
	referenceTestImplementation 'io.consensys.tuweni:tuweni-bytes'
	referenceTestImplementation 'io.consensys.tuweni:tuweni-ssz'
	referenceTestImplementation 'io.airlift:aircompressor-v3'
}

task cleanReferenceTestClasses(type: Delete) {
	delete project.file('src/referenceTest/generated')
	delete project.file('src/referenceTest/generated_tests')
}

def refTestArchivesDir = rootProject.file(rootProject.ext.refTestArchivesDir)
def generatedTestsDir = project.file('src/referenceTest/generated_tests')

sourceSets {
	referenceTest {
		// Legacy location of the expanded consensus-spec-tests tree: never copy it into build/resources.
		resources.exclude 'consensus-spec-tests/**'
	}
}

// Converts each downloaded reference test tarball into a <config>.zip archive containing a single
// top-level <config>/ directory. The tests mount these through the JDK zip filesystem, so the
// fixtures never need to be expanded on disk.
def convertRefTestOptions = [
	general: ['--strip-prefix', 'tests/'],
	minimal: ['--strip-prefix', 'tests/'],
	mainnet: ['--strip-prefix', 'tests/'],
	bls: ['--add-prefix', 'bls/'],
	'slashing-protection-interchange': [
		'--include',
		'.*/tests/generated/[^/]+\\.json',
		'--flatten',
		'--add-prefix',
		'slashing-protection-interchange/'
	],
]
def convertRefTestDownloadTasks = [
	general: ':downloadEthRefTests',
	minimal: ':downloadEthRefTests',
	mainnet: ':downloadEthRefTests',
	bls: ':downloadBlsRefTests',
	'slashing-protection-interchange': ':downloadSlashingProtectionInterchangeRefTests',
]
def convertRefTestTasks = rootProject.ext.refTestTarballs.collect { config, tarball ->
	def taskSuffix = config.split('-').collect { it.capitalize() }.join()
	def zip = new File(refTestArchivesDir, "${config}.zip")
	tasks.register("convertRefTests${taskSuffix}", JavaExec) {
		group = "Execution"
		description = "Convert the ${config} reference test tarball into ${zip.name}"
		dependsOn convertRefTestDownloadTasks[config]
		classpath = configurations.refTestGenerator
		mainClass = 'tech.pegasys.teku.ethtests.ReferenceTestArchiveConverter'
		args = [tarball, zip.absolutePath] + convertRefTestOptions[config]
		inputs.file(tarball).withPropertyName('tarball')
		inputs.files(configurations.refTestGenerator)
				.withPropertyName('converterClasspath')
				.withNormalizer(ClasspathNormalizer)
		outputs.file(zip).withPropertyName('archive')
		doFirst { refTestArchivesDir.mkdirs() }
	}
}

task convertRefTests {
	group = "Execution"
	description = "Convert all reference test tarballs into zip archives"
	dependsOn convertRefTestTasks
}

// Lets the tests read either the zip archives (default) or a plain directory of <config>/ trees,
// e.g. vectors generated from a local consensus-specs checkout:
//   ./gradlew referenceTest -Dteku.ref-test.root-dir=/path/to/tests
def refTestRootDirOverride = System.getProperty('teku.ref-test.root-dir')
def configureRefTestLocation = { task ->
	if (refTestRootDirOverride) {
		task.systemProperty('teku.ref-test.root-dir', refTestRootDirOverride)
	} else {
		task.dependsOn convertRefTests
		task.systemProperty('teku.ref-test.archives-dir', refTestArchivesDir.absolutePath)
	}
}

task generateReferenceTestClasses(type: JavaExec) {
	group = "Execution"
	description = "Generate reference test classes"
	classpath = configurations.refTestGenerator
	mainClass = 'tech.pegasys.teku.ethtests.ReferenceTestGenerator'
	args = [
		generatedTestsDir.absolutePath
	]
	configureRefTestLocation(it)

	// Declare inputs and outputs so Gradle can skip the task when nothing relevant
	// changed, and reuse outputs via the build cache.
	if (refTestRootDirOverride) {
		inputs.dir(refTestRootDirOverride)
				.withPropertyName('refTestRootDir')
				.withPathSensitivity(PathSensitivity.RELATIVE)
	} else {
		inputs.files(fileTree(refTestArchivesDir) { include '*.zip' })
		.withPropertyName('refTestArchives')
		.withPathSensitivity(PathSensitivity.NAME_ONLY)
	}
	inputs.files(configurations.refTestGenerator)
			.withPropertyName('generatorClasspath')
			.withNormalizer(ClasspathNormalizer)
	outputs.dir(generatedTestsDir)
			.withPropertyName('generatedTests')
	outputs.cacheIf { true }

	// Always start from a clean output directory so files for removed test
	// fixtures do not linger when the task does need to re-run.
	doFirst {
		delete generatedTestsDir
		generatedTestsDir.mkdirs()
	}
}

compileReferenceTestJava {
	dependsOn generateReferenceTestClasses
	// Fork worker to compile tests and avoid OoM errors during compilation
	options.fork = true
	options.forkOptions.memoryMaximumSize = "2048m"
}

tasks.named('referenceTest') {
	configureRefTestLocation(it)
	// Each test JVM keeps the zip central directories in memory (~200MB for minimal + mainnet)
	// on top of the states under test, so give it more than Gradle's 512m default.
	maxHeapSize = '2g'
}
