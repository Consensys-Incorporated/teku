name: renovatebot

on:
  schedule:
    - cron: "15 3 * * 1"
  workflow_dispatch:

permissions: {} # lock everything by default (least-privilege)

jobs:
  renovatebot-check:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run renovatebot
        uses: Consensys-Incorporated/github-actions/renovatebot@d7118b7e3733bac9a7f92f05f02f18c73892d5ad # 2.2.0
        with:
          GH_APP_ID: ${{ secrets.RENOVATE_APP_ID }}
          GH_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          GH_REPOSITORY: ${{ github.repository }}
