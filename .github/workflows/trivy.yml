---
name: Trivy

on:
  push:
    branches:
      - ci/consensys-incorporated-github-actions
  pull_request:
    branches:
      - ci/consensys-incorporated-github-actions
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {} # lock everything by default (least-privilege)

jobs:
  trivy:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: Consensys-Incorporated/github-actions/.github/workflows/trivy.yml@d7118b7e3733bac9a7f92f05f02f18c73892d5ad # 2.2.0
    with:
      environment: security # holds SLACK_WEBHOOK
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }} # value from the security environment
