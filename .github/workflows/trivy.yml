---
name: Trivy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {} # lock everything by default (least-privilege)

jobs:
  trivy:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: Consensys-Incorporated/github-actions/.github/workflows/trivy.yml@d7118b7e3733bac9a7f92f05f02f18c73892d5ad # 2.2.0
    with:
      # Only the scheduled scan notifies Slack, so only it needs the security
      # environment (which holds SLACK_WEBHOOK). Pull request branches can't
      # deploy to that environment here; other runs use none.
      environment: ${{ github.event_name == 'schedule' && 'security' || '' }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }} # value from the security environment
