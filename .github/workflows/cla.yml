---
# https://github.com/contributor-assistant/github-action
name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened,closed,synchronize]

permissions:
  contents: write # 'write' = this repo itself, 'read' = remote repository
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # v2.6.1
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Consensys-Incorporated/cla/blob/main/CLA.md' 
          branch: 'cla'
          allowlist: dependabot[bot],ci-protocols-renovate[bot]