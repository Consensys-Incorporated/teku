
name: publish-release

on:
  workflow_call:
    inputs:
      assemble_run_id:
        required: true
        type: string
      publish_version:
        required: true
        type: string
      debug:
        required: false
        type: boolean
        default: false
jobs:
  publishRelease:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    environment: publish
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: 'recursive'

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Install python deps for cloudsmith
        run: |
          sudo apt update
          sudo apt install python3 python3-pip python3-venv

      - name: Validate signing key
        env:
          SIGNING_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "ERROR: JRELEASER_GPG_SECRET_KEY is not set. Cannot stage unsigned artifacts for Maven Central."
            exit 1
          fi

      - name: Stage Maven artifacts
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
        run: |
          ./gradlew --no-daemon --parallel ${{ inputs.debug == true && '--debug' || '--info' }} publishAllPublicationsToStagingRepository

      - name: Publish to Cloudsmith
        env:
          CLOUDSMITH_USER: ${{ secrets.CLOUDSMITH_USER }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          ./gradlew --no-daemon --parallel ${{ inputs.debug == true && '--debug' || '--info' }} cloudsmithUpload publishAllPublicationsToCloudsmithRepository

      - name: Publish to Maven Central
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
        run: |
          cd build/staging-deploy
          zip -r ../../tech.pegasys.teku-${{ inputs.publish_version }}.zip .
          cd ../..
          BEARER=$(echo -n "${MAVEN_CENTRAL_USERNAME}:${MAVEN_CENTRAL_PASSWORD}" | base64 -w 0)
          curl --fail --location --request POST \
            --header "Authorization: Bearer ${BEARER}" \
            --form bundle=@tech.pegasys.teku-${{ inputs.publish_version }}.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC"

      # this next part is only on a release from tag (not snapshots)
      - name: create distributions dir
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p build/distributions/

      - name: Download distribution
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.assemble_run_id }}
          pattern: distribution-*
          merge-multiple: true
          path: build/distributions/

      - name: Generate Checksum
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ./build/distributions
        run: |
          shasum -a 256 "teku-${{ inputs.publish_version }}.tar.gz" > "teku-${{ inputs.publish_version }}.tar.gz.sha256"
          shasum -a 256 "teku-${{ inputs.publish_version }}.zip" > "teku-${{ inputs.publish_version }}.zip.sha256"

      - name: Determine Prerelease
        if: startsWith(github.ref, 'refs/tags/')
        id: determine-prerelease
        run: |
          if [[ "${{ inputs.publish_version }}" == *-RC* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
      # Create release tag and attach the distribution
      #v2.6.1
      - name: Teku Release
        if: startsWith(github.ref, 'refs/tags/')
        id: release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          files: |
            build/distributions/teku-${{ inputs.publish_version }}.tar.gz
            build/distributions/teku-${{ inputs.publish_version }}.tar.gz.sha256
            build/distributions/teku-${{ inputs.publish_version }}.zip
            build/distributions/teku-${{ inputs.publish_version }}.zip.sha256
          tag_name: ${{ inputs.publish_version }}
          body: |
            **Teku Release**
          draft: true
          prerelease: ${{ steps.determine-prerelease.outputs.prerelease }}
          preserve_order: true      
