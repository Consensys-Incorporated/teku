name: matrix-tests-template

on:
  workflow_call:

    inputs:
      assemble_output_run_id:
        type: string
        required: true
      stage_name:
        type: string
        required: true
      stage_key:
        type: string
        required: true
      gradle_task:
        type: string
        required: true
      # Where to look for test sources, and the root segment used to compute FQNs
      src_pattern:
        type: string
        required: true
      src_root:
        type: string
        required: true
      runner:
        type: string
        required: false
        default: ubuntu-latest-128
      gradle_args:
        type: string
        required: false
        default: ''
      retry_attempts:
        type: number
        required: false
        default: 1
      shard_count:
        type: number
        required: false
        default: 12

permissions:
  actions: read     # download the assemble output as an artifacts
  contents: read

jobs:
  planShards:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: 'recursive'

      - name: Restore cached test timings
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: test-timing-${{ inputs.stage_key }}.json
          key: test-timing-${{ inputs.stage_key }}-nonexistent
          restore-keys: |
            test-timing-${{ inputs.stage_key }}-

      # Greedy LPT (longest-processing-time-first) bin-packing of test classes across
      # shards, using timings cached by capture-test-timings on the last master run.
      # Classes with no cached timing (new classes, or no cache yet) get the average of
      # known classes so the plan stays balanced instead of dumping them all in shard 0.
      - name: Compute shard plan
        id: plan
        shell: bash
        env:
          STAGE_KEY: ${{ inputs.stage_key }}
          SHARD_COUNT: ${{ inputs.shard_count }}
          SRC_PATTERN: ${{ inputs.src_pattern }}
          SRC_ROOT: ${{ inputs.src_root }}
        run: |
          find . -type f -name "*.java" -path "$SRC_PATTERN" \
            | sed "s@.*/$SRC_ROOT/@@" \
            | sed 's@/@.@g' \
            | sed 's/.\{5\}$//' \
            | sort > classes.txt

          python3 <<'PY'
          import json, os

          stage = os.environ["STAGE_KEY"]
          shards = int(os.environ["SHARD_COUNT"])

          with open("classes.txt") as f:
              classes = [line.strip() for line in f if line.strip()]

          timing_file = f"test-timing-{stage}.json"
          timings = {}
          if os.path.exists(timing_file):
              with open(timing_file) as f:
                  timings = json.load(f)

          known = [timings[c] for c in classes if c in timings]
          default_time = (sum(known) / len(known)) if known else 1.0

          weighted = sorted(
              ((c, timings.get(c, default_time)) for c in classes), key=lambda x: -x[1]
          )
          bin_totals = [0.0] * shards
          plan = {str(i): [] for i in range(shards)}
          for classname, duration in weighted:
              target = min(range(shards), key=lambda i: bin_totals[i])
              bin_totals[target] += duration
              plan[str(target)].append(classname)

          with open("plan.json", "w") as f:
              json.dump(plan, f)
          print(f"planned {len(classes)} classes across {shards} shards ({len(known)} with known timing)")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"shards={json.dumps(list(range(shards)))}\n")
          PY

      - name: Upload shard plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.stage_key }}-shard-plan
          path: plan.json
          retention-days: 1

  matrix-tests-template:
    needs: planShards
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        # [0 .. shard_count-1], emitted by planShards
        shard: ${{ fromJSON(needs.planShards.outputs.shards) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: 'recursive'
          fetch-depth: 0  # Full history
          fetch-tags: true

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Download assemble-output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.assemble_output_run_id }}
          name: assemble-output
          path: ${{ runner.temp }}
      - name: Unpack assemble-output
        shell: bash
        run: |
          tar --use-compress-program=zstd -xf "$RUNNER_TEMP/assemble-output.tar.zst" -C "$GITHUB_WORKSPACE"
          rm "$RUNNER_TEMP/assemble-output.tar.zst"

      - name: Download shard plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.stage_key }}-shard-plan
          path: ${{ github.workspace }}

      # only acceptance tests need the docker image and login
      - name: Download Teku docker image
        if: ${{ inputs.stage_key == 'acceptance' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.assemble_output_run_id }}
          name: teku-docker-image
          path: ${{ runner.temp }}

      - name: Load Teku docker image
        if: ${{ inputs.stage_key == 'acceptance' }}
        shell: bash
        run: |
          zstd -dc "${{ runner.temp }}/teku-docker-image.tar.zst" | docker load && rm "${{ runner.temp }}/teku-docker-image.tar.zst" && docker images consensys/teku

      # v4.6.0
      - name: Login to dockerhub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: ${{ inputs.stage_key == 'acceptance' }}
        with:
          # Don't panic, throw away account to avoid Docker rate limits when downloading.
          # Second reason we're doing this is so that forked PRs from external contributors works ie env vars aren't visible to forked PRs from within contexts
          username: "cddockeruser"
          password: "fa8651f2-88be-48b7-98ce-e711bd376252"

      - name: Compute shard ${{ matrix.shard }} of ${{ inputs.shard_count }} for ${{ inputs.stage_name }}
        id: shard
        shell: bash
        run: |
          # Classes for this shard come from the timing-based plan built by planShards.
          CLASSES_FOR_SHARD=$(python3 -c "
          import json
          plan = json.load(open('plan.json'))
          print('\n'.join(plan.get('${{ matrix.shard }}', [])))
          ")
          if [ -z "$CLASSES_FOR_SHARD" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Build --tests args
          GRADLE_ARGS=$(printf "%s\n" "$CLASSES_FOR_SHARD" | awk '{printf "--tests %s ", $0}')
          echo "Prepared arguments for Gradle (${{ inputs.stage_name }}): $GRADLE_ARGS"
          echo "args=$GRADLE_ARGS" >> "$GITHUB_OUTPUT"

      - name: Run ${{ inputs.stage_name }} (shard)
        if: steps.shard.outputs.args != ''
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: ${{ inputs.retry_attempts }}
          command: ./gradlew --no-daemon --parallel ${{ inputs.gradle_args }} ${{ inputs.gradle_task }} ${{ steps.shard.outputs.args }}

      - name: Merge JUnit XML for ${{ inputs.stage_name }}
        if: always()
        uses: ./.github/actions/merge-junit-xml
        with:
          output: build/test-results/merged/TEST-${{ inputs.stage_key }}-${{ matrix.shard }}.xml

      - name: Upload JUnit XML + HTML for ${{ inputs.stage_name }}
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.stage_key }}-reports-${{ matrix.shard }}
          # XML only: nothing reads the HTML report, and the merged XML keeps each test's
          # captured output, which is what test-reports.yml and capture-test-timings consume.
          path: |
            build/test-results/merged/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 1
          # A rerun of one failed shard would otherwise add a second artifact with the same
          # name next to the stale one, and test-reports.yml / capture-test-timings download both.
          overwrite: true
