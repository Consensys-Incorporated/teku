
name: publish-docker

on:
  workflow_call:
    inputs:
      assemble_run_id:
        required: true
        type: string
      jdk_version:
        required: true
        type: string
        default: "jdk25"
      include_hash_in_docker:
        required: false
        type: string
        default: 'false'
        # no boolean type

jobs:
  # DockerTags
  # The default Docker tag tracks the Java 25 runtime image.
  # develop = develop-jdk25
  publishDocker:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    environment: publish
    outputs:
      image_digest: ${{ steps.dockerBuildPush.outputs.digest }}
    steps:
      # Only the Dockerfile is needed from the checkout. Nothing in this job runs Gradle: every
      # step here can mint an OIDC token for the publish environment (id-token: write), so the
      # build dependency tree is kept out of it and the distribution comes from assemble.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pull base images through the GCR mirror but fall back to docker.io when the mirror
          # is missing a blob. BASE_IMAGE_PREFIX below points the Dockerfiles at docker.io so
          # the fallback can kick in; everywhere else they default to the mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Download distribution tar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.assemble_run_id }}
          name: distribution-tar
          path: ${{ runner.temp }}
      - name: get workflow_details
        id: jdkDetails
        shell: bash
        # Inputs go through env rather than ${{ }} in the script so a crafted ref name or dispatch
        # input cannot inject shell into a job that can push to Docker Hub.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          JDK_VERSION: ${{ inputs.jdk_version }}
          INCLUDE_HASH_IN_DOCKER: ${{ inputs.include_hash_in_docker }}
        run: |
          # on a release tag also add `latest` and `maj.min` version tags if it's not an `rc`
          if [ "$EVENT_NAME" == "push" ] && [ "$REF_TYPE" == "tag" ]; then
            echo "buildVersion=$REF_NAME" >> "$GITHUB_OUTPUT"
            dockertags="consensys/teku:$REF_NAME-$JDK_VERSION"
            # Only the default jdk25 image gets the bare tags (as with `develop` below); otherwise
            # each variant job pushes them and whichever finishes last wins.
            if [ "$JDK_VERSION" = "jdk25" ]; then
              dockertags="$dockertags,consensys/teku:$REF_NAME"
            fi

            semver="$REF_NAME"
            if [[ ${semver,,} != *"-rc"* ]]; then
              echo "It's not an rc version, proceeding with extra tags..."
              # Extract major.minor 
              if [[ $semver =~ ^([0-9]+)\.([0-9]+)\.[0-9]+(-rc)?$ ]]; then
                major_minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
                echo "major.minor: $major_minor"
              else
                echo "Invalid semver string"
              fi              
              dockertags="${dockertags},consensys/teku:${major_minor}-${JDK_VERSION},consensys/teku:latest-${JDK_VERSION}"
              if [ "$JDK_VERSION" = "jdk25" ]; then
                dockertags="${dockertags},consensys/teku:${major_minor},consensys/teku:latest"
              fi
            fi
            echo "dockertags=${dockertags}" >> "$GITHUB_OUTPUT"

          else
            echo "buildVersion=develop" >> "$GITHUB_OUTPUT"
            dockertags="consensys/teku:develop-$JDK_VERSION"
            if [ "$JDK_VERSION" = "jdk25" ]; then
              dockertags="$dockertags,consensys/teku:develop"
            fi
            if [ "$INCLUDE_HASH_IN_DOCKER" = "true" ]; then
              dockertags="$dockertags,consensys/teku:$SHA"
            fi
            echo "dockertags=${dockertags}" >> "$GITHUB_OUTPUT"
          fi
      # Same layout as the dockerDistUntar Gradle task: build/docker-teku/teku/ plus the Dockerfile.
      - name: Get the artifacts in one place
        shell: bash
        env:
          JDK_VERSION: ${{ inputs.jdk_version }}
          BUILD_VERSION: ${{ steps.jdkDetails.outputs.buildVersion }}
          DOCKER_TAGS: ${{ steps.jdkDetails.outputs.dockertags }}
        run: |
          mkdir -p build/docker-teku/
          tar -xzf "$RUNNER_TEMP"/teku-*.tar.gz -C build/docker-teku/
          mv build/docker-teku/teku-* build/docker-teku/teku
          cp "docker/$JDK_VERSION/Dockerfile" build/docker-teku/
          echo "Creating buildVersion: $BUILD_VERSION"
          echo "Creating dockertags: $DOCKER_TAGS"
      # Docker Hub OIDC: short-lived push token issued to the publish environment, no stored password.
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # Login to push takes ~3m10s; default token lifetime is 5 min.
          DOCKERHUB_OIDC_EXPIREIN: 600
        with:
          username: consensys
      
      - name: build and push the combined manifest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: dockerBuildPush
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: build/docker-teku/.
          platforms: linux/arm64,linux/amd64
          provenance: false
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache          
          build-args: |
            BASE_IMAGE_PREFIX=docker.io/library/
            VERSION=${{ steps.jdkDetails.outputs.buildVersion }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.jdkDetails.outputs.build_date }}
          push: true
          tags: ${{ steps.jdkDetails.outputs.dockertags }}

  signAndAttest:
    runs-on: ubuntu-24.04
    needs: publishDocker
    permissions:
      id-token: write
    environment: publish
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: consensys

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image with keyless cosign
        env:
          IMAGE_DIGEST: ${{ needs.publishDocker.outputs.image_digest }}
        run: |
          IMAGE=docker.io/consensys/teku@$IMAGE_DIGEST
          echo "Signing $IMAGE"
          cosign sign --yes $IMAGE
      - name: Generate provenance file
        run: |
          BUILD_STARTED_ON="${{ github.event.head_commit.timestamp }}"
          # Fallback to current time if head_commit.timestamp is not available (e.g., in workflow_call events)
          if [ -z "$BUILD_STARTED_ON" ]; then
            BUILD_STARTED_ON=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          fi
          BUILD_FINISHED_ON=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > provenance.json <<'EOF'
          {
            "buildType": "https://slsa.dev/container/v1",
            "builder": {
              "id": "https://github.com/${{ github.repository }}/.github/workflows/${{ github.workflow_ref }}"
            },
            "invocation": {
              "parameters": {
                "git_ref": "${{ github.ref }}",
                "git_sha": "${{ github.sha }}",
                "build_run_id": "${{ github.run_id }}",
                "build_run_number": "${{ github.run_number }}"
              }
            },
            "metadata": {
              "buildStartedOn": "__BUILD_STARTED_ON__",
              "buildFinishedOn": "__BUILD_FINISHED_ON__"
            },
            "source": {
              "repository": "https://github.com/${{ github.repository }}",
              "revision": "${{ github.sha }}"
            }
          }
          EOF
          sed -i "s/__BUILD_STARTED_ON__/$BUILD_STARTED_ON/" provenance.json
          sed -i "s/__BUILD_FINISHED_ON__/$BUILD_FINISHED_ON/" provenance.json
      - name: Attest cosign provenance 
        env:
          IMAGE_DIGEST: ${{ needs.publishDocker.outputs.image_digest }}
        run: |
          IMAGE=docker.io/consensys/teku@$IMAGE_DIGEST
          echo "Attesting provenance for $IMAGE"
          cosign attest --yes --predicate provenance.json --type slsaprovenance $IMAGE
