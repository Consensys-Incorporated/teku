
name: publish-docker

on:
  workflow_call:
    inputs:
      assemble_run_id:
        required: true
        type: string
      jdk_version:
        required: true
        type: string
        default: "jdk25"
      include_hash_in_docker:
        required: false
        type: string
        default: 'false'
        # no boolean type

jobs:
  # DockerTags
  # The default Docker tag tracks the Java 25 runtime image.
  # develop = develop-jdk25
  publishDocker:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    environment: publish
    outputs:
      image_digest: ${{ steps.dockerBuildPush.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: 'recursive'
          # The jars are rebuilt in this job and their manifest Implementation-Version comes from
          # git describe; with a shallow, tagless checkout it is UNKNOWN+g<sha>.
          fetch-depth: 0
          fetch-tags: true
      - name: Prepare
        uses: ./.github/actions/prepare
      # v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
        with:
          # Pull base images through the GCR mirror but fall back to docker.io when the mirror
          # is missing a blob. BASE_IMAGE_PREFIX below points the Dockerfiles at docker.io so
          # the fallback can kick in; everywhere else they default to the mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Download assemble-output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.assemble_run_id }}
          name: assemble-output
          path: ${{ runner.temp }}
      - name: Unpack assemble-output
        shell: bash
        run: |
          tar --use-compress-program=zstd -xf "$RUNNER_TEMP/assemble-output.tar.zst" -C "$GITHUB_WORKSPACE"
          rm "$RUNNER_TEMP/assemble-output.tar.zst"
      - name: get workflow_details
        id: jdkDetails
        shell: bash
        run: |
          # on a release tag also add `latest` and `maj.min` version tags if it's not an `rc`
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref_type }}" == "tag" ]; then
            echo "buildVersion=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            dockertags="consensys/teku:${{ github.ref_name }},consensys/teku:${{ github.ref_name }}-${{ inputs.jdk_version }}"
            
            semver=${{ github.ref_name }}
            if [[ ${semver,,} != *"-rc"* ]]; then
              echo "It's not an rc version, proceeding with extra tags..."
              # Extract major.minor 
              if [[ $semver =~ ^([0-9]+)\.([0-9]+)\.[0-9]+(-rc)?$ ]]; then
                major_minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
                echo "major.minor: $major_minor"
              else
                echo "Invalid semver string"
              fi              
              dockertags="${dockertags},consensys/teku:${major_minor},consensys/teku:${major_minor}-${{ inputs.jdk_version }}"
              dockertags="${dockertags},consensys/teku:latest,consensys/teku:latest-${{ inputs.jdk_version }}"
            fi
            echo "dockertags=${dockertags}" >> $GITHUB_OUTPUT

          else
            echo "buildVersion=develop" >> $GITHUB_OUTPUT
            dockertags="consensys/teku:develop-${{ inputs.jdk_version }}"
            if [ "${{ inputs.jdk_version }}" = "jdk25" ]; then
              dockertags="$dockertags,consensys/teku:develop"
            fi
            if [ "${{ inputs.include_hash_in_docker }}" = "true" ]; then
              dockertags="$dockertags,consensys/teku:${{ github.sha }}"
            fi
            echo "dockertags=${dockertags}" >> $GITHUB_OUTPUT
          fi
      - name: Get the artifacts in one place
        run: |
          mkdir -p build/docker-teku/
          ./gradlew dockerDistUntar
          cp docker/${{ inputs.jdk_version }}/Dockerfile build/docker-teku/
          echo "Creating buildVersion: ${{ steps.jdkDetails.outputs.buildVersion }}"
          echo "Creating dockertags: ${{ steps.jdkDetails.outputs.dockertags }}"
          # tree build/docker-teku/
      # v4.6.0
      # Docker Hub OIDC: short-lived push token issued to the publish environment, no stored password.
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # Login to push takes ~3m10s; default token lifetime is 5 min.
          DOCKERHUB_OIDC_EXPIREIN: 600
        with:
          username: consensys
      
      # v7.0.0
      - name: build and push the combined manifest
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        id: dockerBuildPush
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: build/docker-teku/.
          platforms: linux/arm64,linux/amd64
          provenance: false
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache          
          build-args: |
            BASE_IMAGE_PREFIX=docker.io/library/
            VERSION=${{ steps.jdkDetails.outputs.buildVersion }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.jdkDetails.outputs.build_date }}
          push: true
          tags: ${{ steps.jdkDetails.outputs.dockertags }}

  signAndAttest:
    runs-on: ubuntu-24.04
    needs: publishDocker
    permissions:
      id-token: write
    environment: publish
    steps:
      # v4.6.0
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: consensys

      # v4
      - name: Install cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22
      - name: Sign image with keyless cosign
        env:
          IMAGE_DIGEST: ${{ needs.publishDocker.outputs.image_digest }}
        run: |
          IMAGE=docker.io/consensys/teku@$IMAGE_DIGEST
          echo "Signing $IMAGE"
          cosign sign --yes $IMAGE
      - name: Generate provenance file
        run: |
          BUILD_STARTED_ON="${{ github.event.head_commit.timestamp }}"
          # Fallback to current time if head_commit.timestamp is not available (e.g., in workflow_call events)
          if [ -z "$BUILD_STARTED_ON" ]; then
            BUILD_STARTED_ON=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          fi
          BUILD_FINISHED_ON=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > provenance.json <<'EOF'
          {
            "buildType": "https://slsa.dev/container/v1",
            "builder": {
              "id": "https://github.com/${{ github.repository }}/.github/workflows/${{ github.workflow_ref }}"
            },
            "invocation": {
              "parameters": {
                "git_ref": "${{ github.ref }}",
                "git_sha": "${{ github.sha }}",
                "build_run_id": "${{ github.run_id }}",
                "build_run_number": "${{ github.run_number }}"
              }
            },
            "metadata": {
              "buildStartedOn": "__BUILD_STARTED_ON__",
              "buildFinishedOn": "__BUILD_FINISHED_ON__"
            },
            "source": {
              "repository": "https://github.com/${{ github.repository }}",
              "revision": "${{ github.sha }}"
            }
          }
          EOF
          sed -i "s/__BUILD_STARTED_ON__/$BUILD_STARTED_ON/" provenance.json
          sed -i "s/__BUILD_FINISHED_ON__/$BUILD_FINISHED_ON/" provenance.json
      - name: Attest cosign provenance 
        env:
          IMAGE_DIGEST: ${{ needs.publishDocker.outputs.image_digest }}
        run: |
          IMAGE=docker.io/consensys/teku@$IMAGE_DIGEST
          echo "Attesting provenance for $IMAGE"
          cosign attest --yes --predicate provenance.json --type slsaprovenance $IMAGE
