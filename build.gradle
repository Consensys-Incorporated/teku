class ConfiguredLicenseBundleNormalizer extends LicenseBundleNormalizer {
	private final licenseReportExtension

	ConfiguredLicenseBundleNormalizer(licenseReportExtension) {
		this.licenseReportExtension = licenseReportExtension
	}

	@Override
	protected Collection<LicenseFileDetails> normalizeLicenseFileDetailsLicense(
			final List transformationRuleMatchers,
			final LicenseFileDetails licenseFileDetails,
			final String module) {
		if (licenseFileDetails.file == null || licenseFileDetails.file.isEmpty()) {
			return [licenseFileDetails]
		}
		def rules = transformationRulesFor(
				transformationRuleMatchers,
				module,
				licenseFileDetails.license,
				licenseFileDetails.licenseUrl,
				{ new File("${licenseReportExtension.absoluteOutputDir}/${licenseFileDetails.file}").text }.memoize())
		if (rules.isEmpty()) {
			return [licenseFileDetails]
		}
		return rules.collect { normalizeSingleLicenseFileDetailsLicense(it, licenseFileDetails) }
	}
}

class ConfiguredJsonReportRenderer extends JsonReportRenderer {
	private final licenseReportExtension

	ConfiguredJsonReportRenderer(licenseReportExtension, final String fileName, final boolean onlyOneLicensePerModule) {
		super(fileName, onlyOneLicensePerModule)
		this.licenseReportExtension = licenseReportExtension
	}

	@Override
	void render(final ProjectData data) {
		def jsonReport = [:]
		if (onlyOneLicensePerModuleCache) {
			jsonReport.dependencies = renderSingleLicensePerModule(data.allDependencies)
		} else {
			jsonReport.dependencies = renderAllLicensesPerModule(data.allDependencies)
		}
		jsonReport.importedModules = readImportedModules(data.importedModules)
		new File(licenseReportExtension.absoluteOutputDir, fileNameCache).text =
				new JsonBuilder(trimAndRemoveNullEntries(jsonReport)).toPrettyString()
	}
}

// --- Git CLI helpers (replaces grgit plugin for worktree compatibility) ---
ext.runGitCommand = { String... args ->
	try {
		def execResult = providers.exec {
			commandLine(['git'] + args.toList())
			workingDir = projectDir
			ignoreExitValue = true
		}
		if (execResult.result.get().exitValue != 0) return null
		return execResult.standardOutput.asText.get().trim()
	} catch (Exception e) {
		return null
	}
}

ext.isGitCheckout = runGitCommand('rev-parse', '--git-dir') != null

ext.gitCommitHash = {
	->
	def result = runGitCommand('rev-parse', 'HEAD')
	if (result == null) throw new GradleException('Failed to resolve git commit hash')
	return result
}
ext.gitCommitHashShort = {
	->
	def result = runGitCommand('rev-parse', '--short', 'HEAD')
	if (result == null) throw new GradleException('Failed to resolve git commit hash')
	return result
}
ext.gitDescribe = { -> runGitCommand('describe', '--tags') }
ext.gitLastCommitDate = {
	->
	def ts = runGitCommand('log', '-1', '--format=%ct')
	if (ts == null) throw new GradleException('Failed to resolve git commit date')
	return new Date(ts.toLong() * 1000)
}
ext.gitBranchName = {
	->
	def result = runGitCommand('rev-parse', '--abbrev-ref', 'HEAD')
	if (result == null) throw new GradleException('Failed to resolve git branch name')
	return result
}

