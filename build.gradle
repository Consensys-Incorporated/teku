// https://github.com/jk1/Gradle-License-Report/issues/337#issuecomment-3241442179
// License report tasks resolve subproject configurations which requires exclusive project locks in Gradle 9.
// The plugin doesn't support --parallel, so disable the original tasks and run them in a separate
// Gradle process with --no-parallel.
generateLicenseReport.enabled = false
checkLicense.enabled = false
tasks.register('licenseCheck', Exec) {
	def output = new ByteArrayOutputStream()
	workingDir rootDir
	commandLine './gradlew', 'generateLicenseReport', 'checkLicense', '--no-parallel', '-PenableLicenseReport=true'
	standardOutput = output
	errorOutput = output
	ignoreExitValue = true
	doLast {
		def result = executionResult.get()
		if (result.exitValue != 0) {
			logger.error(output.toString().trim())
			throw new GradleException("License check failed")
		}
	}
}
