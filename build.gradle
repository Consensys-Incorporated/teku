						usage('java-runtime') { fromResolutionResult() }
					}
					suppressPomMetadataWarningsFor('testFixturesApiElements')
					suppressPomMetadataWarningsFor('testFixturesRuntimeElements')
					pom {
						name = "Teku - ${project.name}"
						description = "Teku Ethereum consensus client - ${project.name}"
						url = 'https://github.com/Consensys/teku'
						licenses {
							license {
								name = 'The Apache License, Version 2.0'
								url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
							}
						}
						developers {
							developer {
								name = 'Consensys'
								email = 'protocols@consensys.net'
								organization = 'Consensys'
								organizationUrl = 'https://consensys.net'
							}
						}
						scm {
							connection = 'scm:git:git://github.com/Consensys/teku.git'
							developerConnection = 'https://github.com/Consensys/teku.git'
							url = 'https://github.com/Consensys/teku'
						}
						// workaround
						// https://stackoverflow.com/questions/69877418/why-does-every-pom-file-published-by-gradle-has-a-self-referential-dependency
						// https://github.com/spring-gradle-plugins/dependency-management-plugin/issues/365
						withXml {
							asNode().dependencies.dependency.each { dep ->
								if(dep["artifactId"].last().value().last() == artifactId) {
									assert dep.parent().remove(dep)
								}
							}
						}
					}
				}
			}
		}

		signing {
			def signingKey = findProperty("signingKey")
			def signingPassword = findProperty("signingPassword") ?: ""
			if (signingKey) {
				required { gradle.taskGraph.allTasks.any { it.name.contains("ToStagingRepository") } }
				useInMemoryPgpKeys(signingKey, signingPassword)
				sign publishing.publications.mavenJava
			}
		}
	}

	if (project.file('src/jmh/java').exists()) {
		sourceSets {
			jmh {
				java.srcDirs = ['src/jmh/java']
				resources.srcDirs = ['src/jmh/resources']
				compileClasspath += sourceSets.main.runtimeClasspath
			}
		}

		tasks.getByName("compileJmhJava") {

			options.compilerArgs = []

			options.errorprone {
				enabled = false
			}
		}

		dependencies {
			jmhImplementation 'org.openjdk.jmh:jmh-core'
			jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess'
		}

		classes.finalizedBy(jmhClasses)

		tasks.register('jmh', JavaExec) {
			dependsOn jmhClasses
			mainClass = 'org.openjdk.jmh.Main'
			classpath = sourceSets.jmh.compileClasspath + sourceSets.jmh.runtimeClasspath
			systemProperty("jmh.blackhole.mode", "COMPILER")
		}
	}


	configurations {
		integrationTestImplementation.extendsFrom testImplementation
		acceptanceTestImplementation.extendsFrom testImplementation
		propertyTestImplementation.extendsFrom testImplementation
		referenceTestImplementation.extendsFrom testImplementation

		integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
		acceptanceTestRuntimeOnly.extendsFrom testRuntimeOnly
		propertyTestRuntimeOnly.extendsFrom testRuntimeOnly
		referenceTestRuntimeOnly.extendsFrom testRuntimeOnly

		// Details at https://github.com/Hakky54/log-captor#using-log-captor-alongside-with-other-logging-libraries
		testImplementation {
			exclude(group: "org.apache.logging.log4j", module: "log4j-slf4j-impl")
			exclude(group: "org.apache.logging.log4j", module: "log4j-slf4j2-impl")
		}
	}

	def jarName = project.name
	def parent = project.parent
	while (parent != null) {
		if (parent != rootProject || jarName != 'teku') {
			jarName = parent.name + '-' + jarName
		}
		parent = parent.parent
	}

	jar {
		archiveBaseName = jarName
		manifest {
			attributes(
			'Specification-Title': jarName,
			'Specification-Version': project.version,
			'Implementation-Title': jarName,
			'Implementation-Version': specificVersion
			)
		}
		reproducibleFileOrder = true
		preserveFileTimestamps = false
	}

	dependencies {
		compileOnlyApi 'com.google.code.findbugs:jsr305'
		implementation 'com.google.guava:guava'
		implementation 'org.apache.commons:commons-lang3'
		implementation 'org.apache.logging.log4j:log4j-api'

		runtimeOnly 'org.apache.logging.log4j:log4j-core'
		runtimeOnly 'org.apache.logging.log4j:log4j-slf4j-impl'

		testImplementation 'org.assertj:assertj-core'
		testImplementation 'org.mockito:mockito-core'
		testImplementation 'org.junit.jupiter:junit-jupiter-api'
		testImplementation 'org.junit.jupiter:junit-jupiter-params'

		testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'

		testFixturesImplementation 'org.assertj:assertj-core'

		testFixturesRuntimeOnly 'org.apiguardian:apiguardian-api'

		propertyTestImplementation 'net.jqwik:jqwik'
	}

	if (!baseInfrastructureProjects.contains(project.path)) {
		dependencies.implementation(project(':infrastructure:unsigned'))
		dependencies.testRuntimeOnly(dependencies.testFixtures(project(':infrastructure:logging')))
	}

	tasks.register('integrationTest', Test) {
		dependsOn compileIntegrationTestJava
		group = "verification"
		description = "Runs the Teku integration tests"

		testClassesDirs = sourceSets.integrationTest.output.classesDirs
		classpath = sourceSets.integrationTest.runtimeClasspath
	}

	tasks.register('acceptanceTest', Test) {
		dependsOn "compileAcceptanceTestJava", rootProject.distDocker
		group = "verification"
		description = "Runs the Teku acceptance tests"

		systemProperty "teku.testArtifactDir", layout.buildDirectory.dir("test-artifacts").get().asFile.absolutePath
		testClassesDirs = sourceSets.acceptanceTest.output.classesDirs
		classpath = sourceSets.acceptanceTest.runtimeClasspath
	}

	tasks.register('propertyTest', Test) {
		dependsOn "compilePropertyTestJava"
		group = "verification"
		description = "Runs the Teku property tests"

		testClassesDirs = sourceSets.propertyTest.output.classesDirs
		classpath = sourceSets.propertyTest.runtimeClasspath
	}

	tasks.register('referenceTest', Test) {
		dependsOn "compileReferenceTestJava"
		group = "verification"
		description = "Runs the Teku reference tests"

		testClassesDirs = sourceSets.referenceTest.output.classesDirs
		classpath = sourceSets.referenceTest.runtimeClasspath
		finalizedBy 'jacocoReferenceTestReport'
	}

	// avoids JDK 24+ warning from native libraries (e.g. jblst) across all Test tasks
	tasks.withType(Test).configureEach {
		jvmArgs '--enable-native-access=ALL-UNNAMED'
	}

	tasks.register('resolveCiDependencies') {
		group = 'build setup'
		description = 'Resolves test runtime configurations used by CI shards to warm the Gradle cache.'

		doLast {
			resolveCiDependencyConfigurations(project)
		}
	}
}

tasks.register('resolveCiDependencies') {
	group = 'build setup'
	description = 'Resolves test runtime configurations used by CI shards to warm the Gradle cache.'
	dependsOn subprojects.collect { it.tasks.named('resolveCiDependencies') }

	doLast {
		resolveCiDependencyConfigurations(project)
	}
}

tasks.register('jacocoRootReport', JacocoReport) {
	group = 'verification'
	description = 'Generates an aggregate JaCoCo coverage report for all submodule unit tests'

	subprojects.each { subproject ->
		subproject.tasks.matching { t -> t.name == 'test' }.each { testTask ->
			executionData(testTask)
		}
		if (subproject.plugins.hasPlugin('java-library')) {
			sourceDirectories.from subproject.sourceSets.main.allSource.srcDirs
			classDirectories.from subproject.sourceSets.main.output.classesDirs
		}
	}

	reports {
		html {
			required = true
			outputLocation = layout.buildDirectory.dir('reports/jacoco/aggregate/html')
		}
		xml {
			required = true
			outputLocation = layout.buildDirectory.file('reports/jacoco/aggregate/jacocoRootReport.xml')
		}
	}
}

tasks.register('jacocoReferenceTestRootReport', JacocoReport) {
	group = 'verification'
	description = 'Generates an aggregate JaCoCo coverage report for all submodule reference tests'

	mustRunAfter 'jacocoRootReport'

	subprojects.each { subproject ->
		subproject.tasks.matching { t -> t.name == 'referenceTest' }.each { refTestTask ->
			executionData(refTestTask)
		}
		if (subproject.plugins.hasPlugin('java-library')) {
			sourceDirectories.from subproject.sourceSets.main.allSource.srcDirs
			classDirectories.from subproject.sourceSets.main.output.classesDirs
		}
	}

	reports {
		html {
			required = true
			outputLocation = layout.buildDirectory.dir('reports/jacoco/referenceTest/html')
		}
		xml {
			required = true
			outputLocation = layout.buildDirectory.file('reports/jacoco/referenceTest/jacocoReferenceTestRootReport.xml')
		}
	}
}

tasks.register('jacocoCombinedRootReport', JacocoReport) {
	group = 'verification'
	description = 'Generates a combined aggregate JaCoCo coverage report for unit tests and reference tests'

	dependsOn tasks.named('jacocoRootReport'), tasks.named('jacocoReferenceTestRootReport')

	subprojects.each { subproject ->
		subproject.tasks.matching { t -> t.name == 'test' }.each { testTask ->
			executionData(testTask)
		}
		subproject.tasks.matching { t -> t.name == 'referenceTest' }.each { refTestTask ->
			executionData(refTestTask)
		}
		if (subproject.plugins.hasPlugin('java-library')) {
			sourceDirectories.from subproject.sourceSets.main.allSource.srcDirs
			classDirectories.from subproject.sourceSets.main.output.classesDirs
		}
	}

	reports {
		html {
			required = true
			outputLocation = layout.buildDirectory.dir('reports/jacoco/combined/html')
		}
		xml {
			required = true
			outputLocation = layout.buildDirectory.file('reports/jacoco/combined/jacocoCombinedRootReport.xml')
		}
	}
}

