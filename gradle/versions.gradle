dependencyManagement {
	imports {
		mavenBom 'io.netty:netty-bom:4.2.18.Final'
		// Remove these pins when Javalin uses Jetty 12.1.11 or later.
		// Jetty 12.1.11 fixes https://github.com/jetty/jetty.project/issues/15226.
		mavenBom 'org.eclipse.jetty:jetty-bom:12.1.11'
		mavenBom 'org.eclipse.jetty.ee10:jetty-ee10-bom:12.1.11'
	}
	dependencies {
		dependency 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
		dependencySet(group: 'com.fasterxml.jackson.dataformat', version: '2.22.3') {
			entry 'jackson-dataformat-yaml'
			entry 'jackson-dataformat-toml'
		}
		dependency 'com.fasterxml.jackson.module:jackson-module-blackbird:2.22.3'

		dependencySet(group: 'com.google.errorprone', version: '2.50.0') {
			entry 'error_prone_annotations'
			entry 'error_prone_check_api'
			entry 'error_prone_core'
		}

		dependency 'tech.pegasys.tools.epchecks:errorprone-checks:1.1.1'

		dependencySet(group: 'com.google.code.findbugs', version: '3.0.2') {
			entry 'jsr305'
		}
		dependency 'com.google.guava:guava:33.7.2-jre'

		dependency 'org.yaml:snakeyaml:2.7'

		dependency 'org.jsoup:jsoup:1.23.2'

		dependency 'com.launchdarkly:okhttp-eventsource:4.3.0'

		dependencySet(group: 'com.squareup.okhttp3', version: '4.12.0') {
			entry 'okhttp'
			entry 'logging-interceptor'
			entry 'mockwebserver'
		}

		dependency 'info.picocli:picocli:4.7.7'

		dependencySet(group: 'io.javalin', version: '7.2.3') {
			entry 'javalin'
			entry 'javalin-rendering-thymeleaf'
		}

		dependency 'io.libp2p:jvm-libp2p:1.3.7-RELEASE'
		dependency 'tech.pegasys:jblst:0.3.18'
		dependency 'io.consensys.protocols:jc-kzg-4844:2.1.8'
		dependency 'io.github.crate-crypto:java-eth-kzg:0.10.0'

		dependency 'org.hdrhistogram:HdrHistogram:2.2.2'

		dependency 'org.jetbrains.kotlin:kotlin-stdlib:2.4.20'

		dependency 'org.mock-server:mockserver-junit-jupiter:5.15.0'

		dependencySet(group: 'io.swagger.core.v3', version: '2.2.55') {
			entry 'swagger-annotations'
		}

		// On update don't forget to change version in tech.pegasys.teku.infrastructure.restapi.SwaggerUIBuilder
		dependency 'org.webjars:swagger-ui:5.33.1'

		dependency 'org.thymeleaf:thymeleaf:3.1.5.RELEASE'
