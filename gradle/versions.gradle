			entry 'tuweni-units'
		}

		dependency 'org.apache.commons:commons-text:1.15.0'
		dependency 'org.apache.commons:commons-lang3:3.21.0'
		dependency 'commons-io:commons-io:2.22.0'
		dependency 'org.commonjava.mimeparse:mimeparse:0.1.3.3'

		dependencySet(group: 'org.apache.logging.log4j', version: '2.26.1') {
			entry 'log4j-api'
