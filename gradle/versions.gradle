		dependencySet(group: "org.openjdk.jmh", version: "1.37") {
			entry 'jmh-core'
			entry 'jmh-generator-annprocess'
		}
		dependency 'org.rocksdb:rocksdbjni:10.10.1.1'
		dependency 'org.fusesource.leveldbjni:leveldbjni:1.8'
		dependency 'tech.pegasys:leveldb-native:0.3.1'

		dependencySet(group: "org.web3j", version: "6.0.0") {
			entry 'core'
		}

		dependency 'io.airlift:aircompressor-v3:3.10'

		dependency 'io.prometheus:prometheus-metrics-bom:1.5.1'

		dependencySet(group: 'org.hyperledger.besu.internal', version: '26.9.0') {
			entry 'besu-metrics-core'
			entry 'besu-ethereum-core'
			entry 'besu-config'
		}
		dependencySet(group: 'org.hyperledger.besu', version: '26.9.0') {
			entry 'besu-datatypes'
			entry 'besu-evm'
			entry 'besu-plugin-api'
		}

		dependencySet(group: 'org.testcontainers', version: '1.21.4') {
			entry "testcontainers"
			entry "junit-jupiter"
		}

		dependency 'io.consensys.protocols:discovery:26.8.0'

		dependencySet(group: 'org.jupnp', version: '3.0.5') {
			entry "org.jupnp"
			entry "org.jupnp.support"
		}

		dependencySet(group: 'io.jsonwebtoken', version: '0.13.0') {
			entry 'jjwt-api'
			entry 'jjwt-impl'
			entry 'jjwt-jackson'
		}

		dependency 'net.jqwik:jqwik:1.9.3'
